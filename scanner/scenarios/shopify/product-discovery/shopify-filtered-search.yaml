name: "shopify-filtered-search"
description: "Filtered Shopify search returns results with product options agents can use for refinement"
category: product-discovery
requires_capabilities:
  - search

setup:
  - action: search
    params: { catalog: { query: "running shoes" } }
    save_as: search_results
    fallback_queries: ["gift", "shirt", "coffee", "bag", "accessories"]

steps:
  - assertion: array_non_empty
    source: search_results.products
    severity: high
    score_weight: 10
    message: "Filtered search for 'running shoes' returned no products"

  - assertion: field_present
    source: search_results.products.0
    field: options
    severity: medium
    score_weight: 8
    message: "Products missing 'options' — agents cannot offer size/color refinement"

  - assertion: each_item_has_field
    source: search_results.products
    field: id
    condition: non_null
    severity: high
    score_weight: 7
    message: "Products missing 'id' — agents cannot fetch product details"

teardown: []
