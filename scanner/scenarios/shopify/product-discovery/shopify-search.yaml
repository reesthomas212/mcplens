name: "shopify-search"
description: "Basic search returns results using Shopify's UCP search_catalog tool"
category: product-discovery
requires_capabilities:
  - search

setup:
  - action: search
    params: { catalog: { query: "sneakers" } }
    save_as: search_results
    fallback_queries: ["gift", "shirt", "coffee", "bag", "accessories"]

steps:
  - assertion: schema_match
    source: search_results
    severity: high
    score_weight: 10
    message: "Search response is not a valid object"

  - assertion: field_present
    source: search_results
    field: products
    severity: high
    score_weight: 10
    message: "Search response missing 'products' field — Shopify UCP schema may have changed"

  - assertion: array_non_empty
    source: search_results.products
    severity: high
    score_weight: 10
    message: "Search for 'sneakers' returned no products"

  - assertion: field_present
    source: search_results
    field: pagination
    severity: medium
    score_weight: 5
    message: "Search response missing 'pagination' field"

  - assertion: field_present
    source: search_results.products.0
    field: id
    severity: high
    score_weight: 5
    message: "First product missing 'id' — agents cannot reference products for detail or cart operations"

teardown: []
