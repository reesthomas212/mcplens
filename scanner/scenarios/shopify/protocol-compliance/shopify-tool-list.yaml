name: "shopify-tool-list"
description: "Verify that the Shopify MCP server exposes a UCP catalog search tool and it is callable"
category: protocol-compliance
requires_capabilities:
  - search

setup:
  - action: search
    params: { catalog: { query: "test product" } }
    save_as: search_results
    fallback_queries: ["gift", "shirt", "coffee", "bag", "accessories"]

steps:
  - assertion: schema_match
    source: search_results
    severity: high
    score_weight: 10
    message: "search_catalog did not return a valid object response"

  - assertion: field_present
    source: search_results
    field: products
    severity: high
    score_weight: 10
    message: "search_catalog response missing 'products' field"

  - assertion: field_present
    source: search_results
    field: pagination
    severity: medium
    score_weight: 5
    message: "search_catalog response missing 'pagination' — pagination support not confirmed"

teardown: []
