name: "shopify-cart-update"
description: "Verify that products from search have the data needed to add to cart (product id and variants)"
category: checkout-flow
requires_capabilities:
  - add_to_cart
  - search

setup:
  - action: search
    params: { catalog: { query: "shoe bag" } }
    save_as: search_results
    fallback_queries: ["gift", "shirt", "coffee", "bag", "accessories"]

steps:
  - assertion: array_non_empty
    source: search_results.products
    severity: high
    score_weight: 5
    message: "Search returned no products — cannot test cart readiness"

  - assertion: each_item_has_field
    source: search_results.products
    field: id
    condition: non_null
    severity: high
    score_weight: 10
    message: "Products missing 'id' — agents cannot add items to cart"

  - assertion: field_present
    source: search_results.products.0
    field: id
    severity: high
    score_weight: 10
    message: "First product missing 'id' field — cannot construct add-to-cart payload"

teardown: []
