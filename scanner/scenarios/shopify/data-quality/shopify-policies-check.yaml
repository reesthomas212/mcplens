name: "shopify-policies-check"
description: "Verify the store's MCP endpoint can answer common buyer questions about shipping, returns, and policies"
category: data-quality
requires_capabilities:
  - policies

setup:
  - action: policies
    params: { query: "what is your return policy?" }
    save_as: policy_result

steps:
  - assertion: array_non_empty
    source: policy_result
    severity: high
    score_weight: 8
    message: "Policies query returned no answers — AI agents cannot answer buyer questions about returns/shipping"

  - assertion: each_item_has_field
    source: policy_result
    field: answer
    condition: non_null
    severity: high
    score_weight: 8
    message: "Policy entries missing 'answer' field — AI agents cannot relay return policy to buyers"

  - assertion: each_item_has_field
    source: policy_result
    field: question
    condition: non_null
    severity: low
    score_weight: 3
    message: "Policy entries missing 'question' field — agents cannot match answers to buyer questions"

teardown: []
