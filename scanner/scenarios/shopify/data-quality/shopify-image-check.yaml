name: "shopify-image-check"
description: "Checks that Shopify products expose media (images) that agents can use in responses"
category: data-quality
requires_capabilities:
  - search

setup:
  - action: search
    params: { catalog: { query: "running" } }
    save_as: search_results
    fallback_queries: ["gift", "shirt", "coffee", "bag", "accessories"]

steps:
  - assertion: array_non_empty
    source: search_results.products
    severity: high
    score_weight: 5
    message: "Search returned no products — cannot check images"

  - assertion: percentage_threshold
    source: search_results.products
    field: media
    condition: non_null
    threshold: 80
    severity: medium
    score_weight: 8
    message: "{fail_pct}% of products lack media (threshold: 20%)"

  - assertion: field_present
    source: search_results.products.0.media.0
    field: url
    severity: medium
    score_weight: 5
    message: "First product's media entry is missing a 'url' — agents cannot show product images"

teardown: []
